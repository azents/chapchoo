[workspace]
members = [
    "crates/domain",
    "crates/crypto",
    "crates/persistence",
    "crates/protocol",
    "crates/service",
    "crates/rpc",
    "crates/mail",
    "crates/openai-auth",
    "crates/kubernetes",
    "crates/docker",
    "crates/harness",
    "apps/chapchoo",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
jsonschema = { version = "0.61.0", default-features = false }
bcrypt = "0.19.3"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
email_address = { version = "0.2.9", default-features = false }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
hkdf = "0.12.4"
getrandom = { version = "0.4.3", features = ["std"] }
uuid = { version = "1.29.0", default-features = false, features = ["std"] }
any_ascii = "0.3.3"
hmac = "0.12.1"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.18"
zeroize = { version = "1.9.0", features = ["derive"] }
chapchoo-domain = { path = "crates/domain" }
chapchoo-crypto = { path = "crates/crypto" }
chapchoo-persistence = { path = "crates/persistence" }
chapchoo-protocol = { path = "crates/protocol" }
chapchoo-service = { path = "crates/service" }
chapchoo-rpc = { path = "crates/rpc" }
chapchoo-mail = { path = "crates/mail" }
chapchoo-openai-auth = { path = "crates/openai-auth" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form", "system-proxy", "http2"] }
oauth2 = { version = "5.0.0", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
parking_lot = "0.12.5"
chapchoo-kubernetes = { path = "crates/kubernetes" }
chapchoo-docker = { path = "crates/docker" }
chapchoo-harness = { path = "crates/harness" }
agent-client-protocol = { version = "=5.0.0", features = ["unstable_protocol_v2"] }
flate2 = "1.1.5"
tar = "0.4.44"
semver = "1.0.27"
bollard = { version = "=0.21.1", default-features = false }
kube = { version = "5.0.0", default-features = false, features = ["client", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.29.0", features = ["v1_33"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
diesel = { version = "2.3.14", default-features = false, features = ["sqlite", "postgres_backend", "uuid"] }
diesel-async = { version = "0.9.2", features = ["postgres", "sqlite", "bb8", "migrations"] }
diesel_migrations = { version = "2.3.2", features = ["sqlite", "postgres"] }
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "process", "io-util"] }
tempfile = "3.27.0"
tonic = "0.14.8"
tower = { version = "0.5.3", features = ["util"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tonic-prost = "0.14.8"
tonic-prost-build = "0.14.8"
prost = "0.14.4"
prost-types = "0.14.4"
protoc-bin-vendored = "3.3.0"
url = "2.5.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
tonic-health = "0.14.8"
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
nix = { version = "0.31.3", features = ["signal", "process"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
await_holding_invalid_type = "deny"
let_underscore_future = "deny"
mem_forget = "deny"
exit = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
checked_conversions = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
