[package]
name = "chapchoo-docker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Explicit local integration fixture; requires OpenSSH client/server executables.
ssh-fixture = []

[dependencies]
bollard.workspace = true
chapchoo-domain.workspace = true
chapchoo-protocol.workspace = true
futures-util.workspace = true
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util.workspace = true
jiff.workspace = true
percent-encoding = "2.3.2"
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8.5"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
http-body-util = "0.1.3"
hyper = { version = "1.12.0", features = ["server", "http1"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }

[lints]
workspace = true
