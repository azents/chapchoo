repos:
  - repo: local
    hooks:
      - id: rust-quality
        name: Rust format, lint, test and dependency boundaries
        entry: bash scripts/check-rust.sh
        language: system
        files: ^(rust/|scripts/check-rust\.|scripts/run-rust-tests\.py)
        pass_filenames: false
      - id: rpc-contracts
        name: Generated RPC contracts and live Node/Rust interoperability
        entry: bash scripts/check-rpc.sh
        language: system
        files: ^(proto/|rust/|typescript/packages/chapchoo-rpc-client/|scripts/(generate-rpc-clients\.sh|check-rpc\.sh|test-rpc-clients\.py|run-rust-tests\.py))
        pass_filenames: false
      - id: snapshot-contracts
        name: Validate complete native snapshot publication contracts
        entry: python3 -m unittest scripts.tests.test_snapshot
        language: system
        files: ^(\.github/workflows/snapshot\.yaml|scripts/(publish-snapshot\.py|tests/test_snapshot\.py))
        pass_filenames: false
      - id: linux-package-contracts
        name: Validate safe Linux artifact assembly and independent image contracts
        entry: python3 -m unittest scripts.tests.test_package_linux
        language: system
        files: ^(scripts/(package-linux\.py|tests/test_package_linux\.py)|images/chapchoo/)
        pass_filenames: false
      - id: helm-chart-contracts
        name: Render and validate Helm and Argo preparation contracts offline
        entry: uv run --locked --project .codex python scripts/check-chart.py
        language: system
        files: ^(infra/charts/chapchoo/|scripts/(check-chart\.py|tests/test_chart_contracts\.py)|testenv/chapchoo/(chart-values\.yaml|argocd-example\.yaml))
        pass_filenames: false
      - id: ensure-claude-md-link
        name: Ensure CLAUDE.md imports AGENTS.md
        entry: bash scripts/ensure-claude-md-link.sh
        language: system
        files: AGENTS\.md$
      - id: validate-chapchoo-docs-frontmatter
        name: Validate chapchoo docs frontmatter
        language: python
        entry: python scripts/docs_catalog.py validate
        files: ^(docs/chapchoo/.*\.md|scripts/docs_catalog\.py)$
        pass_filenames: false
      - id: test-chapchoo-docs-catalog
        name: Test chapchoo docs catalog
        language: python
        entry: python -m unittest scripts.tests.test_docs_catalog
        files: ^(scripts/docs_catalog\.py|scripts/tests/test_docs_catalog\.py|docs/chapchoo/AGENTS\.md)$
        pass_filenames: false
      - id: generate-conventions-index
        name: Regenerate .claude/rules/*-conventions.md tables from convention bodies
        language: python
        entry: python scripts/generate-conventions-index.py
        additional_dependencies: [python-frontmatter==1.3.0]
        files: ^\.claude/(conventions|rules)/.*\.md$
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys, --no-ensure-ascii]
        exclude: openapi\.json$
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^infra/charts/chapchoo/templates/
      - id: fix-byte-order-marker
        exclude: ^.*\.csv$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi, jupyter]
  # TypeScript
  - repo: local
    hooks:
      - id: ts-format
        name: Format TypeScript
        language: system
        entry: bash -c 'cd typescript && pnpm run format'
        files: ^typescript/.*\.(ts|tsx|json)$
        pass_filenames: false
      - id: ts-lint
        name: Lint TypeScript
        language: system
        entry: bash -c 'cd typescript && pnpm run lint:fix'
        files: ^typescript/.*\.(ts|tsx)$
        pass_filenames: false
      - id: ts-typecheck
        name: TypeScript type check
        language: system
        entry: bash -c 'cd typescript && pnpm run typecheck'
        files: ^typescript/.*\.(ts|tsx)$
        pass_filenames: false
exclude: |
  (?x)^(
    # auto-generated
    python/libs/chapchoo-admin-client/.*|
    python/libs/chapchoo-public-client/.*|
    typescript/packages/chapchoo-admin-client/src/generated/.*|
    typescript/packages/chapchoo-public-client/src/generated/.*|
    typescript/packages/chapchoo-rpc-client/src/generated/.*|
    .*pnpm-lock\.yaml$
  )$
