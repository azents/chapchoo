name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI needs assertions and diagnostics, not full debugger symbol tables.
      # Keep local dev/test profiles and production release builds unchanged.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CHAPCHOO_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/chapchoo_test
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chapchoo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chapchoo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable installer
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          shared-key: rust-quality
          cache-workspace-crates: true
      - run: bash scripts/check-rust.sh
      - name: Preserve per-crate compilation timing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-compilation-timing
          path: rust/target/cargo-timings/
          if-no-files-found: ignore
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      STORYBOOK_DISABLE_TELEMETRY: "1"
      CHAPCHOO_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/chapchoo_test
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chapchoo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chapchoo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable installer
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: typescript/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: typescript
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          shared-key: contracts
          cache-workspace-crates: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            typescript/.turbo
            typescript/apps/*/.next/cache
          key: frontend-${{ runner.os }}-${{ hashFiles('typescript/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: frontend-${{ runner.os }}-${{ hashFiles('typescript/pnpm-lock.yaml') }}-
      - name: Repository hooks without separately owned quality checks
        # Rust is owned by the rust job; frontend read-only checks run below.
        # Local commits still execute every configured hook.
        env:
          SKIP: rust-quality,ts-format,ts-lint,ts-typecheck
        run: uvx pre-commit run --all-files
      - run: uv run --locked --project .codex python -m unittest discover -s .codex/hooks -p '*_test.py'
      - run: python -m unittest scripts.tests.test_docs_catalog
      - run: python -m unittest scripts.tests.test_ci_structure scripts.tests.test_build_artifacts
      - run: python scripts/docs_catalog.py validate
      - name: Validate inherited skill packages and helper tests
        run: |
          for skill in .claude/skills/*; do
            uv run --locked --project .codex python .claude/skills/skill-creator/scripts/quick_validate.py "$skill"
          done
          python -m unittest discover -s .claude/skills/ci-optimization/scripts -p '*_test.py'
          for skill in convention-audit living-spec-audit skill-creator; do
            uv run --locked --project .codex --with 'pytest==9.1.1' python -m pytest ".claude/skills/$skill/scripts" -q
          done
      - run: pnpm run format:check && pnpm run lint && pnpm run typecheck
        working-directory: typescript
      - name: Account web tests, product builds and component stories
        run: |
          pnpm --filter @chapchoo/ui test
          pnpm --filter @chapchoo/web-core test
          pnpm --filter @chapchoo/web test
          pnpm --filter @chapchoo/admin-web test
          pnpm --filter @chapchoo/e2e test:unit
          pnpm run build
          pnpm run build-storybook --filter=@chapchoo/web --filter=@chapchoo/admin-web --filter=@chapchoo/design-reference
        working-directory: typescript
  accounts-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable installer
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          shared-key: browser
          cache-workspace-crates: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: typescript/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Expose runner PostgreSQL tools
        run: |
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
          test -x "$(pg_config --bindir)/initdb"
          test -x "$(pg_config --bindir)/pg_ctl"
      - run: pnpm install --frozen-lockfile
        working-directory: typescript
      - run: pnpm --filter @chapchoo/e2e exec playwright install chromium
        working-directory: typescript
      - run: pnpm --filter @chapchoo/e2e test:e2e
        working-directory: typescript
