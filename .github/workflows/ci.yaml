name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-x86:
    uses: ./.github/workflows/build-web.yaml
    with:
      runner: ubuntu-24.04
      architecture: x86_64
  web-arm:
    uses: ./.github/workflows/build-web.yaml
    with:
      runner: ubuntu-24.04-arm
      architecture: aarch64
  binary-x86:
    uses: ./.github/workflows/build-binary.yaml
    with:
      runner: ubuntu-24.04
      architecture: x86_64
  binary-arm:
    uses: ./.github/workflows/build-binary.yaml
    with:
      runner: ubuntu-24.04-arm
      architecture: aarch64
  native-build:
    needs: [web-x86, binary-x86]
    uses: ./.github/workflows/linux-package.yaml
    with:
      runner: ubuntu-24.04
      architecture: x86_64
      node-architecture: x64
  native-build-arm:
    needs: [web-arm, binary-arm]
    uses: ./.github/workflows/linux-package.yaml
    with:
      runner: ubuntu-24.04-arm
      architecture: aarch64
      node-architecture: arm64
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI needs assertions and diagnostics, not full debugger symbol tables.
      # Keep local dev/test profiles and production release builds unchanged.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CHAPCHOO_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/chapchoo_test
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chapchoo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chapchoo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable installer
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          shared-key: rust-quality
          cache-workspace-crates: true
      - run: bash scripts/check-rust.sh
      - name: Preserve per-crate compilation timing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-compilation-timing
          path: rust/target/cargo-timings/
          if-no-files-found: ignore
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      STORYBOOK_DISABLE_TELEMETRY: "1"
      CHAPCHOO_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/chapchoo_test
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chapchoo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chapchoo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable installer
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          shared-key: contracts
          cache-workspace-crates: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Repository hooks without separately owned quality checks
        # Rust and frontend checks have independent CI owners.
        # Local commits still execute every configured hook.
        env:
          SKIP: rust-quality,ts-format,ts-lint,ts-typecheck
        run: uvx pre-commit run --all-files
      - run: uv run --locked --project .codex python -m unittest discover -s .codex/hooks -p '*_test.py'
      - run: python -m unittest scripts.tests.test_validate_docs
      - run: python -m unittest scripts.tests.test_ci_structure scripts.tests.test_build_artifacts
      - run: python scripts/validate_docs.py
      - name: Validate inherited skill packages and helper tests
        run: |
          for skill in .claude/skills/*; do
            uv run --locked --project .codex python .claude/skills/skill-creator/scripts/quick_validate.py "$skill"
          done
          python -m unittest discover -s .claude/skills/ci-optimization/scripts -p '*_test.py'
          for skill in convention-audit skill-creator; do
            uv run --locked --project .codex --with 'pytest==9.1.1' python -m pytest ".claude/skills/$skill/scripts" -q
          done
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable installer
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          shared-key: frontend-generation
          cache-workspace-crates: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: frontend-quality-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: frontend-quality-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm run format:check && pnpm run lint && pnpm run typecheck
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      STORYBOOK_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable installer
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          shared-key: frontend-test-generation
          cache-workspace-crates: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: frontend-tests-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: frontend-tests-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build shared Node modules before direct unit tests
        run: pnpm exec turbo run build --filter=@chapchoo/rpc-client
      - name: Account unit/support tests and component stories
        run: |
          pnpm --filter @chapchoo/ui test
          pnpm --filter @chapchoo/web-core test
          pnpm --filter @chapchoo/web test
          pnpm --filter @chapchoo/admin-web test
          pnpm --filter @chapchoo/testenv test
          pnpm --filter @chapchoo/e2e test:unit
          pnpm --filter @chapchoo/integration test:unit
          node --test typescript/scripts/stage-web-fonts.test.mjs
          node typescript/scripts/stage-web-fonts.mjs web
          node typescript/scripts/stage-web-fonts.mjs admin-web
          pnpm run build-storybook --filter=@chapchoo/ui --filter=@chapchoo/web --filter=@chapchoo/admin-web --filter=@chapchoo/design-reference
      - name: Render each owner's component and browser boundary checks
        run: |
          pnpm --filter @chapchoo/e2e exec playwright install chromium
          pnpm --filter @chapchoo/ui test:components
          pnpm --filter @chapchoo/web-core test:browser
          pnpm --filter @chapchoo/web test:components
          pnpm --filter @chapchoo/admin-web test:components
  validate:
    # Keep the existing aggregate check fail-closed for every split validation job.
    if: always()
    needs: [repository-checks, frontend-quality, frontend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation owner to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ["RESULTS"])
          sys.exit(0 if results and all(result == "success" for result in results) else 1)
          PY
  browser-e2e:
    needs: native-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Expose runner PostgreSQL tools
        run: |
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
          test -x "$(pg_config --bindir)/initdb"
          test -x "$(pg_config --bindir)/pg_ctl"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chapchoo-linux-x86_64
          path: ${{ runner.temp }}/package
      - name: Open this run's built package for the single browser gate
        run: |
          cd "$RUNNER_TEMP/package"
          sha256sum --check chapchoo-linux-x86_64.tar.gz.sha256
          mkdir "$RUNNER_TEMP/installed"
          tar -xzf chapchoo-linux-x86_64.tar.gz -C "$RUNNER_TEMP/installed"
          echo "CHAPCHOO_E2E_PACKAGE_ROOT=$RUNNER_TEMP/installed/chapchoo-linux-x86_64" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chapchoo/e2e exec playwright install chromium
      - run: pnpm --filter @chapchoo/e2e test:e2e
      - name: Build the model-free conversation fixture from the same package
        run: |
          test -S /var/run/docker.sock
          docker buildx build --builder default --load --target runtime-base \
            -f images/chapchoo/Dockerfile -t chapchoo-runtime-base:acceptance .
          docker buildx build --builder default --load \
            --build-context "binary-artifacts=$CHAPCHOO_E2E_PACKAGE_ROOT" \
            -f testenv/chapchoo/fixtures/Dockerfile -t chapchoo-conversation-acceptance:ci .
      - name: Prepare the real session before Send and reuse it for the first input
        env:
          CHAPCHOO_INTEGRATION_DOCKER_AUTHORIZED: disposable
          CHAPCHOO_INTEGRATION_DOCKER_SOCKET: /var/run/docker.sock
          CHAPCHOO_INTEGRATION_DOCKER_IMAGE: chapchoo-conversation-acceptance:ci
        run: |
          export CHAPCHOO_INTEGRATION_BINARY="$CHAPCHOO_E2E_PACKAGE_ROOT/chapchoo"
          pnpm --filter @chapchoo/e2e test:conversation
  docker-integration:
    needs: binary-x86
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Expose runner PostgreSQL tools
        run: |
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
          test -x "$(pg_config --bindir)/initdb"
          test -x "$(pg_config --bindir)/pg_ctl"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-build-x86_64
          path: ${{ runner.temp }}/binary-download
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Use the same-run binary for native Control and Computer image
        run: |
          set -euo pipefail
          test "$(docker info --format '{{.OSType}}')" = linux
          test -S /var/run/docker.sock
          mkdir "$RUNNER_TEMP/computer-binary"
          tar -xf "$RUNNER_TEMP/binary-download/binary-artifacts.tar" -C "$RUNNER_TEMP/computer-binary"
          test "$(cat "$RUNNER_TEMP/computer-binary/architecture")" = amd64
          docker buildx build --load --target backend \
            --build-context "binary-artifacts=$RUNNER_TEMP/computer-binary" \
            -f images/chapchoo/Dockerfile -t chapchoo-computer-acceptance:ci .
          echo "CHAPCHOO_INTEGRATION_BINARY=$RUNNER_TEMP/computer-binary/chapchoo" >> "$GITHUB_ENV"
          echo "CHAPCHOO_INTEGRATION_DOCKER_AUTHORIZED=disposable" >> "$GITHUB_ENV"
          echo "CHAPCHOO_INTEGRATION_DOCKER_SOCKET=/var/run/docker.sock" >> "$GITHUB_ENV"
          echo "CHAPCHOO_INTEGRATION_DOCKER_IMAGE=chapchoo-computer-acceptance:ci" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chapchoo/integration test:integration
      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          version: v0.33.0
          install_only: true
      - name: Verify actual SA authentication and Computer lifecycle in an owned cluster
        run: python3 scripts/check-provider-auth-cluster.py --image chapchoo-computer-acceptance:ci
