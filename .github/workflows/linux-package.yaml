name: Build native Linux packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    uses: ./.github/workflows/build-web.yaml
    with:
      runner: ${{ matrix.runner }}
      architecture: ${{ matrix.architecture }}

  binary-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    uses: ./.github/workflows/build-binary.yaml
    with:
      runner: ${{ matrix.runner }}
      architecture: ${{ matrix.architecture }}

  native-package:
    name: Native ${{ matrix.architecture }} package
    needs: [web-build, binary-build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
            node-architecture: x64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            node-architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert native runner and builder architecture
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          docker_arch="$(docker info --format '{{.Architecture}}')"
          case "$EXPECTED_ARCH:$docker_arch" in
            x86_64:x86_64|x86_64:amd64|aarch64:aarch64|aarch64:arm64) ;;
            *) echo 'Docker must use the same native architecture'; exit 1 ;;
          esac
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-build-${{ matrix.architecture }}
          path: ${{ runner.temp }}/web-download
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-build-${{ matrix.architecture }}
          path: ${{ runner.temp }}/binary-download
      - name: Unpack this run's target build outputs
        run: |
          mkdir "$RUNNER_TEMP/web-artifacts" "$RUNNER_TEMP/binary-artifacts"
          tar -xf "$RUNNER_TEMP/web-download/web-artifacts.tar" -C "$RUNNER_TEMP/web-artifacts"
          tar -xf "$RUNNER_TEMP/binary-download/binary-artifacts.tar" -C "$RUNNER_TEMP/binary-artifacts"
      - name: Package existing target outputs into native images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          WEB_ARTIFACTS: ${{ runner.temp }}/web-artifacts
          BINARY_ARTIFACTS: ${{ runner.temp }}/binary-artifacts
        with:
          source: .
          files: images/chapchoo/ci-bake.hcl
          allow: |
            fs.read=${{ runner.temp }}/web-artifacts
            fs.read=${{ runner.temp }}/binary-artifacts
          set: |
            backend.cache-from=type=gha,scope=backend-${{ matrix.architecture }}
            backend.cache-to=type=gha,scope=backend-${{ matrix.architecture }},mode=max
            general-web.cache-from=type=gha,scope=general-${{ matrix.architecture }}
            general-web.cache-to=type=gha,scope=general-${{ matrix.architecture }},mode=max
            admin-web.cache-from=type=gha,scope=admin-${{ matrix.architecture }}
            admin-web.cache-to=type=gha,scope=admin-${{ matrix.architecture }},mode=max
      - name: Assemble the pinned architecture-matched runtime
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          NODE_ARCHITECTURE: ${{ matrix.node-architecture }}
        run: |
          mkdir "$RUNNER_TEMP/node-inputs"
          cd "$RUNNER_TEMP/node-inputs"
          curl --fail --silent --show-error --location --retry 3 --output SHASUMS256.txt https://nodejs.org/dist/v24.22.1/SHASUMS256.txt
          curl --fail --silent --show-error --location --retry 3 --output "node-v24.22.1-linux-$NODE_ARCHITECTURE.tar.xz" "https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-$NODE_ARCHITECTURE.tar.xz"
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/artifacts"
          python3 scripts/package-linux.py --architecture "$ARCHITECTURE" \
            --binary "$RUNNER_TEMP/binary-artifacts/chapchoo" \
            --node-archive "$RUNNER_TEMP/node-inputs/node-v24.22.1-linux-$NODE_ARCHITECTURE.tar.xz" \
            --node-shasums "$RUNNER_TEMP/node-inputs/SHASUMS256.txt" \
            --general-standalone "$RUNNER_TEMP/web-artifacts/general/standalone" \
            --general-static "$RUNNER_TEMP/web-artifacts/general/static" \
            --general-public "$RUNNER_TEMP/web-artifacts/general/public" \
            --admin-standalone "$RUNNER_TEMP/web-artifacts/admin/standalone" \
            --admin-static "$RUNNER_TEMP/web-artifacts/admin/static" \
            --admin-public "$RUNNER_TEMP/web-artifacts/admin/public" \
            --output "$RUNNER_TEMP/artifacts/chapchoo-linux-$ARCHITECTURE.tar.gz"
      - name: Export the source-free archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chapchoo-linux-${{ matrix.architecture }}
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error
          retention-days: 7
