# No database, credentials, certificate, ingress controller or secret provider is
# provisioned by this chart. Optional Provider bootstrap owns its isolated namespace.
# Confirm prerequisites before a full deployment.
prerequisitesConfirmed: false
fullnameOverride: ""
imagePullSecrets: []
terminationGracePeriodSeconds: 30
backend:
  enabled: true
  topology: combined
  replicas: 1
  groupReplicas: {client: 1, admin: 1, control: 1}
  # For IPv6 clusters set http://[$(POD_IP)]:50053 explicitly.
  peerAdvertise: "http://$(POD_IP):50053"
  image:
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
# Kubernetes is an explicit opt-in; all Provider-specific fields have defaults.
kubernetesProvider:
  enabled: false
  id: ""
  name: ""
  managedNamespace: ""
  createManagedNamespace: true
  controlEndpoint: ""
  authentication:
    method: service-account
    audience: chapchoo-provider-auth
    # Advanced protected-credential deployments may select an existing credential.
    existingCredentialSecret: ""
  # Empty repository inherits the complete selected backend image.
  image: {repository: "", tag: "", digest: "", pullPolicy: IfNotPresent}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  computerImage: {repository: "", tag: "", digest: "", pullPolicy: IfNotPresent}
  storageClass: ""
  storageRequest: 10Gi
  savedMount: /workspace
  computerResources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 1Gi}
database:
  existingSecret: ""
  urlKey: postgres-url
secretKey:
  existingSecret: ""
  key: secret-key
setupProof:
  existingSecret: ""
  key: setup-proof
prepare:
  activeDeadlineSeconds: 300
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 256Mi}
mail:
  enabled: false
  sender: ""
  host: ""
  port: 587
  tls: starttls
  existingCredentialsSecret: ""
  usernameKey: username
  passwordKey: password
general:
  enabled: true
  replicas: 1
  publicUrl: ""
  backendUrl: ""
  image:
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
admin:
  enabled: true
  replicas: 1
  publicUrl: ""
  backendUrl: ""
  image:
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
webIngress:
  enabled: false
  controller: ingress-nginx
  className: ""
  existingTlsSecret: ""
grpcIngress:
  enabled: false
  controller: ingress-nginx
  className: ""
  general:
    enabled: true
    host: ""
    existingTlsSecret: ""
  admin:
    enabled: false
    host: ""
    existingTlsSecret: ""
