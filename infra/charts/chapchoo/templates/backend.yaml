{{- if .Values.backend.enabled }}
{{- $groups := list "combined" }}
{{- if eq .Values.backend.topology "separate" }}{{- $groups = list "client" "admin" "control" }}{{- end }}
{{- range $group := $groups }}
{{- $context := dict "root" $ "component" (printf "backend-%s" $group) }}
{{- $selection := $group }}{{- if eq $group "combined" }}{{- $selection = "client,admin,control" }}{{- end }}
{{- $control := has $group (list "combined" "control") }}
{{- $business := "chapchoo.accounts.TeamManagement" }}
{{- if eq $group "admin" }}{{- $business = "chapchoo.accounts.Installation" }}{{- else if eq $group "control" }}{{- $business = "chapchoo.control.ProviderConnection" }}{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chapchoo.fullname" $ }}-backend-{{ $group }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "chapchoo.labels" $context | fromJson | toYaml | nindent 4 }}
spec:
  replicas: {{ if eq $group "combined" }}{{ $.Values.backend.replicas }}{{ else }}{{ index $.Values.backend.groupReplicas $group }}{{ end }}
  selector:
    matchLabels:
      {{- include "chapchoo.selector" $context | fromJson | toYaml | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chapchoo.selector" $context | fromJson | toYaml | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- if and $control $.Values.kubernetesProvider.enabled (eq $.Values.kubernetesProvider.authentication.method "service-account") }}
      serviceAccountName: {{ include "chapchoo.fullname" $ }}-control
      volumes:
        - name: kubernetes-api
          projected:
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: {fieldPath: metadata.namespace}
      {{- end }}
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "chapchoo.image" $.Values.backend.image | quote }}
          imagePullPolicy: {{ $.Values.backend.image.pullPolicy }}
          args: [serve, --groups, {{ $selection | quote }}]
          ports:
            - name: grpc
              containerPort: 50051
            {{- if $control }}
            - name: peer
              containerPort: 50053
            {{- end }}
          env:
            {{- include "chapchoo.backendEnv" $ | fromJsonArray | toYaml | nindent 12 }}
            - name: CHAPCHOO_LISTEN
              value: "0.0.0.0:50051"
            {{- if $control }}
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
            - name: CHAPCHOO_PEER_LISTEN
              value: "0.0.0.0:50053"
            - name: CHAPCHOO_PEER_ADVERTISE
              value: {{ $.Values.backend.peerAdvertise | quote }}
            {{- if $.Values.kubernetesProvider.enabled }}
            - name: CHAPCHOO_PROVIDER_BOOTSTRAP_CONFIG
              value: {{ include "chapchoo.providerBootstrap" $ | quote }}
            {{- end }}
            {{- end }}
          {{- if and $control $.Values.kubernetesProvider.enabled (eq $.Values.kubernetesProvider.authentication.method "service-account") }}
          volumeMounts:
            - {name: kubernetes-api, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
          {{- end }}
          startupProbe:
            grpc: {port: 50051, service: chapchoo.liveness}
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            grpc: {port: 50051, service: chapchoo.liveness}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            grpc: {port: 50051, service: {{ $business }}}
            periodSeconds: 5
            timeoutSeconds: 7
            failureThreshold: 2
          resources:
            {{- toYaml $.Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "chapchoo.securityContext" $ | fromJson | toYaml | nindent 12 }}
{{- end }}
{{- range $group := list "client" "admin" "control" }}
{{- $selected := printf "backend-%s" $group }}
{{- if eq $.Values.backend.topology "combined" }}{{- $selected = "backend-combined" }}{{- end }}
{{- $service := $group }}{{- if eq $group "client" }}{{- $service = "general" }}{{- end }}
{{- $port := 50051 }}{{- if eq $group "admin" }}{{- $port = 50052 }}{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chapchoo.fullname" $ }}-{{ $service }}-grpc
  namespace: {{ $.Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    {{- include "chapchoo.selector" (dict "root" $ "component" $selected) | fromJson | toYaml | nindent 4 }}
  ports:
    - name: grpc
      port: {{ $port }}
      targetPort: grpc
      protocol: TCP
      appProtocol: kubernetes.io/h2c
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chapchoo.fullname" . }}-peer
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    {{- $selected := "backend-control" }}{{- if eq .Values.backend.topology "combined" }}{{- $selected = "backend-combined" }}{{- end }}
    {{- include "chapchoo.selector" (dict "root" . "component" $selected) | fromJson | toYaml | nindent 4 }}
  ports: [{name: peer, port: 50053, targetPort: peer, protocol: TCP, appProtocol: kubernetes.io/h2c}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chapchoo.fullname" . }}-peer
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/instance, operator: In, values: [{{ .Release.Name | quote }}]}
      - {key: app.kubernetes.io/component, operator: In, values: [backend-combined, backend-control]}
  policyTypes: [Ingress]
  ingress:
    # Component/public gRPC remains separately exposed; only peers are restricted here.
    - ports: [{port: 50051, protocol: TCP}]
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: chapchoo
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - {key: app.kubernetes.io/component, operator: In, values: [backend-combined, backend-client, backend-admin, backend-control]}
      ports: [{port: 50053, protocol: TCP}]
{{- end }}
