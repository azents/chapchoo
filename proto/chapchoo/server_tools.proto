syntax = "proto3";
package chapchoo.server_tools;
import "google/protobuf/empty.proto";
import "conversations.proto";

// Current execution component authority, independent of native capture IDs.
service ServerTools {
  rpc Catalog(CatalogRequest) returns (CatalogResponse);
  rpc Invoke(stream InvocationControl) returns (stream InvocationObservation);
  rpc PrepareExternal(ExternalPreparation) returns (stream ExternalCatalogFrame);
  // Confirm exact owner reuse without creating a callable binding.
  rpc ConfirmExternalReuse(ExternalReuse) returns (ExternalReuseObservation);
  rpc InvokeExternal(ExternalInvocation) returns (Final);
}
// The published operation is selected on the current component route.
message ExternalPreparation {
  CallerScope scope = 1;
  string execution_id = 2;
  string operation_id = 3;
}
message ExternalReuse {
  ExternalPreparation preparation = 1;
  chapchoo.conversations.NativeTarget target = 2;
  bool observe_only = 3;
  // Both fields are supplied together for an already applied external selection.
  string applied_operation_id = 4;
  bytes applied_supply = 5;
}
message ExternalReuseObservation { bool confirmed = 1; }
message ExternalCatalogChunk {
  bytes json = 1;
  bool final_chunk = 2;
  // Stable within the Agent. Zero is absent on older Control versions.
  uint64 model_slot = 3;
}
enum ExternalCatalogFailure {
  EXTERNAL_CATALOG_FAILURE_UNSPECIFIED = 0;
  EXTERNAL_CATALOG_FAILURE_DESTINATION = 1;
  EXTERNAL_CATALOG_FAILURE_CAPACITY = 2;
  EXTERNAL_CATALOG_FAILURE_UNAVAILABLE = 3;
  EXTERNAL_CATALOG_FAILURE_AUTHENTICATION = 4;
  EXTERNAL_CATALOG_FAILURE_PROTOCOL = 5;
  EXTERNAL_CATALOG_FAILURE_TOOLS_UNAVAILABLE = 6;
  EXTERNAL_CATALOG_FAILURE_INVALID_RESPONSE = 7;
  EXTERNAL_CATALOG_FAILURE_TIMEOUT = 8;
  EXTERNAL_CATALOG_FAILURE_SUPERSEDED = 9;
}
message ExternalCatalogFrame {
  string integration_id = 1;
  oneof payload {
    ExternalCatalogChunk catalogue = 2;
    ExternalCatalogFailure unavailable = 3;
    // Last frame. An interrupted stream never applies a partial selection.
    ExternalCatalogEnd end = 4;
  }
}
message ExternalCatalogEnd { bool capacity_limited = 1; }
message ExternalInvocation {
  ExternalPreparation preparation = 1;
  chapchoo.conversations.NativeTarget target = 2;
  string integration_id = 3;
  string name = 4;
  bytes arguments_json = 5;
}
message CallerScope {
  chapchoo.conversations.CaptureSource source = 1;
  string agent_id = 2;
  string conversation_id = 3;
}
message CatalogRequest { CallerScope scope = 1; }
message CatalogResponse { bytes catalog_json = 1; }
message Submit {
  CallerScope scope = 1;
  string name = 2;
  bytes arguments_json = 3;
}
message InvocationControl {
  // Exactly one Submit first; the only later frame is one request-local cancel.
  oneof control {
    Submit submit = 1;
    google.protobuf.Empty cancel = 2;
  }
}
enum Rejection {
  REJECTION_UNSPECIFIED = 0;
  REJECTION_INVALID_ENVELOPE = 1;
  REJECTION_UNKNOWN_TOOL = 2;
  REJECTION_CAPACITY = 3;
  REJECTION_CLOSING = 4;
  REJECTION_CANCELLED = 5;
  REJECTION_QUEUE_EXPIRED = 6;
  REJECTION_RESPONSE_EXPIRED = 7;
  REJECTION_AUTHORITY = 8;
  // External calls only: an upstream failure known to precede dispatch.
  REJECTION_UPSTREAM_UNAVAILABLE = 9;
  REJECTION_UPSTREAM_AUTHENTICATION = 10;
  REJECTION_UPSTREAM_DESTINATION = 11;
  REJECTION_UPSTREAM_PROTOCOL = 12;
  REJECTION_UPSTREAM_INVALID_RESPONSE = 13;
  REJECTION_UPSTREAM_TIMEOUT = 14;
  REJECTION_UPSTREAM_TOOLS_UNAVAILABLE = 15;
}
message Final {
  oneof outcome {
    Rejection not_executed = 1;
    bytes result_json = 2;
    google.protobuf.Empty uncertain = 3;
    google.protobuf.Empty uncertain_representation = 4;
  }
}
message InvocationObservation {
  oneof observation {
    google.protobuf.Empty waiting = 1;
    google.protobuf.Empty started = 2;
    Final final = 3;
  }
}
