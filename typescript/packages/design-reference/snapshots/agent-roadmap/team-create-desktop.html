* { box-sizing: border-box; }
body { margin: 0px; background: rgb(253, 252, 248); color: rgb(53, 58, 54); font-family: Pretendard, sans-serif; }
button, a { font: inherit; color: inherit; }
button { cursor: pointer; border: 0px; background: none; }
svg { width: 20px; height: 20px; fill: none; stroke: currentcolor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
header { height: 76px; border-bottom: 1px solid rgb(225, 227, 215); display: flex; align-items: center; justify-content: space-between; padding: 0px 32px; }
.brand { font-size: 26px; letter-spacing: -1.5px; font-weight: 850; }
.account { width: 34px; height: 34px; border-radius: 50%; background: rgb(233, 234, 223); display: grid; place-items: center; font-size: 13px; font-weight: 650; }
.sidebar { width: 216px; position: absolute; top: 76px; bottom: 0px; min-height: 924px; padding: 38px 18px; background: rgb(243, 242, 233); border-right: 1px solid rgb(225, 227, 215); }
.space { margin: 0px 14px 30px; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; }
.nav { padding: 13px 16px; display: flex; align-items: center; gap: 12px; font-size: 14px; border-radius: 13px; color: rgb(98, 108, 88); }
.nav.active { background: rgb(228, 231, 217); font-weight: 650; color: rgb(53, 58, 54); }
.nav svg { width: 18px; height: 18px; }
main { margin-left: 216px; padding: 58px 64px; min-height: 924px; }
.inner { max-width: 1056px; margin: auto; }
.heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.eyebrow { color: rgb(112, 119, 101); font-size: 13px; margin: 0px 0px 12px; }
h1 { font-size: 32px; line-height: 1.25; letter-spacing: -1px; margin: 0px; font-weight: 730; }
.create { background: rgb(237, 202, 110); border: 1px solid rgb(219, 184, 95); padding: 13px 18px; border-radius: 14px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; box-shadow: rgb(223, 189, 100) 0px 2px 0px; }
