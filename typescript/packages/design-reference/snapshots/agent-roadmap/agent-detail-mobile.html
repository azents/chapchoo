* { box-sizing: border-box; }
body { margin: 0px; font-family: Pretendard, sans-serif; background: rgb(253, 252, 248); color: rgb(53, 58, 54); --primary: #766019; --soft: #f4efdc; --edge: #e5dcbe; }
button, a { font: inherit; color: inherit; }
button { background: none; border: 0px; cursor: pointer; }
svg { width: 21px; height: 21px; fill: none; stroke: currentcolor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
header { height: 76px; border-bottom: 1px solid rgb(225, 227, 215); display: flex; align-items: center; justify-content: space-between; padding: 0px 32px; }
.brand { font-size: 26px; font-weight: 850; letter-spacing: -1.5px; }
.account { width: 34px; height: 34px; display: grid; place-items: center; background: rgb(233, 234, 223); border-radius: 50%; font-size: 13px; }
.brandgroup { display: flex; align-items: center; gap: 15px; }
.menu { display: none; }
.topright { display: flex; gap: 24px; align-items: center; font-size: 13px; }
.sidebar { position: fixed; top: 76px; bottom: 0px; width: 216px; background: rgb(243, 242, 233); border-right: 1px solid rgb(225, 227, 215); padding: 36px 18px; }
.space { display: flex; align-items: center; gap: 10px; margin: 0px 14px 30px; font-size: 15px; }
.nav { display: flex; align-items: center; gap: 12px; padding: 13px 16px; font-size: 14px; border-radius: 13px; color: rgb(98, 108, 88); }
.nav.active { background: rgb(228, 231, 217); color: rgb(53, 58, 54); font-weight: 600; }
.nav svg { width: 18px; }
.side-agent { display: flex; align-items: center; gap: 9px; color: var(--primary); font-size: 13px; margin: 8px 0px 12px 44px; padding: 9px 0px; }
.side-agent .dot { width: 5px; height: 5px; background: var(--primary); }
main { margin-left: 216px; padding: 34px 60px 44px; }
.content { max-width: 980px; margin: auto; }
.back { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: rgb(112, 119, 101); padding: 3px 0px; }
.back svg { width: 16px; }
.profile { position: relative; display: flex; align-items: center; gap: 30px; margin-top: 25px; background: var(--soft); border: 1px solid var(--edge); border-radius: 28px; padding: 25px 40px; min-height: 220px; }
