* { box-sizing: border-box; }
body { margin: 0px; font-family: Pretendard, sans-serif; color: rgb(53, 58, 54); background: rgb(253, 252, 248); }
button, input, textarea { font: inherit; }
button { cursor: pointer; color: inherit; background: none; border: 0px; }
svg { width: 22px; height: 22px; fill: none; stroke: currentcolor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
header { height: 76px; border-bottom: 1px solid rgb(225, 227, 215); display: flex; align-items: center; justify-content: space-between; padding: 0px 32px; }
.brand { font-weight: 850; font-size: 26px; letter-spacing: -1.5px; }
.account { height: 34px; width: 34px; border-radius: 50%; background: rgb(233, 234, 223); display: grid; place-items: center; font-size: 13px; }
.sidebar { position: fixed; top: 76px; bottom: 0px; width: 216px; background: rgb(243, 242, 233); border-right: 1px solid rgb(225, 227, 215); padding: 36px 18px; }
.space { font-size: 15px; margin: 0px 14px 30px; display: flex; align-items: center; gap: 10px; }
.nav { display: flex; align-items: center; gap: 12px; padding: 13px 16px; font-size: 14px; border-radius: 13px; background: rgb(228, 231, 217); font-weight: 600; }
.nav svg { width: 19px; }
.secondary { background: none; font-weight: 400; color: rgb(98, 108, 88); margin-top: 2px; }
main { margin-left: 216px; padding: 36px 48px 48px; }
.workspace { max-width: 780px; margin: auto; }
.back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: rgb(112, 119, 101); padding: 5px 0px; }
.back svg { width: 16px; }
.progress { display: flex; align-items: center; gap: 16px; margin: 25px 0px 31px; }
.step { display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgb(148, 155, 139); white-space: nowrap; }
.step b { width: 23px; height: 23px; display: grid; place-items: center; border-radius: 50%; border: 1px solid rgb(223, 226, 214); font-size: 11px; font-weight: 500; }
.step.active { color: rgb(81, 67, 30); font-weight: 650; }
.step.active b { background: rgb(237, 202, 110); border-color: rgb(237, 202, 110); }
.step.done { color: rgb(98, 108, 88); }
.step.done b { background: rgb(231, 235, 222); border-color: rgb(231, 235, 222); }
.step-line { height: 1px; background: rgb(225, 227, 215); flex: 1 1 0%; }
h1 { font-size: 32px; font-weight: 720; letter-spacing: -1px; margin: 0px 0px 11px; line-height: 1.25; }
.intro { font-size: 14px; color: rgb(112, 119, 101); line-height: 1.6; margin: 0px 0px 28px; }
.section { margin-top: 25px; }
.section-title { font-size: 13px; font-weight: 650; margin: 0px 0px 12px; display: flex; align-items: center; gap: 8px; }
.section-title svg { height: 16px; width: 16px; color: rgb(112, 119, 101); }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card { position: relative; text-align: left; border: 1px solid rgb(225, 227, 215); border-radius: 19px; background: rgb(255, 254, 250); padding: 19px; display: flex; align-items: center; gap: 15px; min-height: 103px; width: 100%; transition: border-color 0.15s; }
.card:hover { border-color: rgb(154, 171, 130); }
.card.selected { border: 1.5px solid rgb(154, 171, 130); background: rgb(240, 243, 232); box-shadow: rgba(231, 237, 219, 0.396) 0px 0px 0px 2px; }
.iconbox { width: 46px; height: 46px; flex-shrink: 0; border-radius: 14px; display: grid; place-items: center; background: rgb(240, 240, 231); color: rgb(98, 108, 88); }
.selected .iconbox { background: rgb(226, 233, 213); color: rgb(82, 102, 64); }
.iconbox svg { height: 25px; width: 25px; }
.copy { min-width: 0px; flex: 1 1 0%; }
.card h2 { font-size: 16px; line-height: 1.35; margin: 0px 22px 5px 0px; font-weight: 620; letter-spacing: -0.2px; }
